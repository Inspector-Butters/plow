[package]
name = "plow"
version = "0.1.0"
description = "A cozy Codex agent farm monitor"
authors = ["Plow contributors"]
edition = "2021"

[lib]
name = "plow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tungstenite = "0.30"
uuid = "1"
